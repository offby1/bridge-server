# This datasource reads the Caddy container's logs straight off the Docker
# socket, so there is no shared volume, no log file, and nothing to rotate.
source: docker

# We match by pattern rather than by exact name so that this does not depend on
# the Compose project name, which is the directory name and so would differ if
# the repo were ever checked out somewhere else. On the current hosts the
# container is called `server-caddy-1`.
container_name_regexp:
  - .*caddy.*

# `type: caddy` is doing far more work than it looks.
#
# The `crowdsecurity/non-syslog` parser -- which ships as a second YAML document
# inside `crowdsecurity/syslog-logs`, not as a file of its own -- copies
# `labels.type` into `evt.Parsed.program`. And `crowdsecurity/caddy-logs` begins
# its filter with `evt.Parsed.program startsWith 'caddy'`.
#
# This one string is therefore what connects our log lines to the Caddy parser.
# If you change it, the parser silently stops matching: there is no error and no
# warning, only a rising count of unparsed lines in `just cscli metrics`.
labels:
  type: caddy

# Nothing here sets follow_stdout or follow_stderr, because both default to true,
# and that default matters. Caddy writes *both* its access log and its runtime
# log to stderr, so a datasource following only stdout would see nothing at all.
# If a future CrowdSec release changes that default, this datasource will go
# quiet.
#
# One consequence is worth knowing about. This datasource carries Caddy's runtime
# lines as well as its access log, and `crowdsecurity/caddy-logs` ignores them,
# because its filter also requires `evt.Unmarshaled.caddy.request != nil` and
# runtime lines have no `request` object. Those lines therefore show up as
# *unparsed*, which is expected rather than a fault. That same filter is why the
# rate limiter's "rate limit exceeded" line is left alone for the Phase 3
# scenario to claim.
