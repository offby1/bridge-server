# Parse the line Caddy's rate limiter writes when it rejects a request.
#
# This is NOT an access-log entry. `crowdsecurity/caddy-logs` deliberately skips
# it, because that parser's filter requires `evt.Unmarshaled.caddy.request !=
# nil` and this line has no `request` object. So without this file the line is
# simply counted as unparsed. The two parsers are mutually exclusive: ours needs
# the rate_limit logger, theirs needs a request.
#
# The line looks like this (Caddy writes it to stderr at *info* level, alongside
# the access log; see the comment above `just caddy-log`):
#
#   {"level":"info","ts":1787333972.2284505,"logger":"http.handlers.rate_limit",
#    "msg":"rate limit exceeded","zone":"list_views","wait":0.047427378,
#    "remote_ip":"200.195.79.237"}
#
# Note what this parser does *not* do: it does not filter by zone. It accepts a
# rejection from any of our three zones and records which one in
# `evt.Meta.ratelimit_zone`, leaving the choice to the scenario. That is
# deliberate. Only `per_ip` is safe to act on -- `list_views` and `whole_site`
# are aggregate, so they reject innocent people during exactly the floods they
# exist for -- but parsing all three means `cscli metrics` shows us how often the
# aggregate zones fire, which is the measurement the open question in
# docs/perf/crowdsec-plan.md actually needs.
#
# A custom parser costs us nothing in signal validity: CrowdSec's rule about
# unmodified hub content applies to *scenarios*, not parsers.
filter: |
  evt.Parsed.program startsWith 'caddy' &&
  UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, 'caddy') in ['', nil] &&
  evt.Unmarshaled.caddy.logger == 'http.handlers.rate_limit' &&
  evt.Unmarshaled.caddy.remote_ip != nil
onsuccess: next_stage
name: offby1/caddy-ratelimit
description: "Parse Caddy rate-limit rejections"
statics:
  # Our own log_type, chosen so these events cannot leak into the hub's HTTP
  # scenarios, which all filter on log_type being http_access-log or
  # http_error-log.
  - meta: log_type
    value: caddy_ratelimit
  - meta: service
    value: http
  # `remote_ip` is at the top level of this line, not nested under `request` the
  # way the access log has it. It is the TCP peer: the rate limiter takes it from
  # r.RemoteAddr and consults no forwarded-for header. Correct while Caddy is the
  # first hop; see the caveat in docs/perf/crowdsec-plan.md about putting a CDN
  # in front.
  - meta: source_ip
    expression: evt.Unmarshaled.caddy.remote_ip
  # Which of the three zones rejected. This is the whole reason a scenario can
  # act on per-IP rejections without touching the aggregate ones.
  - meta: ratelimit_zone
    expression: evt.Unmarshaled.caddy.zone
  - parsed: ratelimit_zone
    expression: evt.Unmarshaled.caddy.zone
  # Copied from crowdsecurity/caddy-logs, which faces the same problem: `ts` is
  # epoch seconds as a float, and the buckets want a real timestamp rather than
  # the moment we happened to read the line.
  - target: evt.StrTime
    expression: |
      Sprintf("%v", evt.Unmarshaled.caddy.ts) matches '^[0-9e\\.\\+]+$' ? int(evt.Unmarshaled.caddy.ts) : evt.Unmarshaled.caddy.ts
